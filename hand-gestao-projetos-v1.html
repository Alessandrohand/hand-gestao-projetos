<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand · Gestão de Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Questrial&display=swap" rel="stylesheet">
<style>:root{
  --mid:#08192C;--cob:#0666C3;--az:#32B2D3;--cream:#F4F2ED;--navy:#172847;--deep:#0449CA;
  --gray:#91918F;--muted:#5C6570;--border:#C4C4C2;--white:#FFFFFF;--txt:#08192C;
  --red:#C0392B;--yel:#F1C40F;--grn:#27AE60;--r:8px;
  --ft:'Poppins','Arial Black',Arial,sans-serif;--fb:'Questrial',Calibri,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--txt);font-family:var(--fb);font-size:15px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--ft);font-weight:600;margin:0;color:var(--mid);line-height:1.2}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}h4{font-size:13px}
button,input,select,textarea{font-family:var(--fb);font-size:14px;color:var(--txt)}
a{color:var(--cob)}

/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--mid);color:var(--cream);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:22px 20px 18px;border-bottom:1px solid rgba(244,242,237,.12)}
.side .brand img{height:34px;display:block}
.side .brand small{display:block;margin-top:10px;color:var(--az);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{padding:12px 10px;flex:1;overflow:auto}
.nav button{all:unset;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:var(--r);cursor:pointer;color:rgba(244,242,237,.82);font-size:14.5px;margin-bottom:2px}
.nav button:hover{background:rgba(50,178,211,.12);color:#fff}
.nav button.on{background:var(--cob);color:#fff}
.nav .ic{width:18px;text-align:center;opacity:.9}
.nav .badge{margin-left:auto;background:var(--az);color:var(--mid);border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
.side .foot{padding:14px 18px;font-size:11px;color:rgba(244,242,237,.55);border-top:1px solid rgba(244,242,237,.12)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:14px 28px;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:19px}
.top .sp{flex:1}
.weeknav{display:flex;align-items:center;gap:6px;background:var(--cream);border:1px solid var(--border);border-radius:var(--r);padding:3px}
.weeknav button{border:0;background:transparent;cursor:pointer;padding:5px 9px;border-radius:6px;font-size:14px}
.weeknav button:hover{background:#fff}
.weeknav .lbl{font-family:var(--ft);font-weight:600;font-size:13.5px;padding:0 6px;min-width:150px;text-align:center}
.weeknav .now{font-size:11px;color:var(--muted)}
.userbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.userbox select{border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:#fff}
.content{padding:24px 28px 60px;max-width:1500px;width:100%}
.demo{background:#FFF8DC;border:1px solid var(--yel);color:#5a4a00;padding:8px 28px;font-size:13px;display:flex;gap:12px;align-items:center}
.demo button{margin-left:auto}

/* components */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.sec{margin:26px 0 12px;display:flex;align-items:center;gap:12px}
.sec h2{font-size:17px}
.sec .hint{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.btn{border:1px solid var(--cob);background:var(--cob);color:#fff;border-radius:6px;padding:7px 13px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--deep)}
.btn.ghost{background:#fff;color:var(--cob)}
.btn.ghost:hover{background:#EEF5FC}
.btn.dark{background:var(--mid);border-color:var(--mid)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ok{background:var(--grn);border-color:var(--grn)}
.btn.no{background:#fff;color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ibtn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:3px 6px;border-radius:5px;font-size:13px}
.ibtn:hover{background:var(--cream);color:var(--cob)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;border:1px solid var(--border);background:#fff;white-space:nowrap}
.chip.b{background:#E7F1FB;border-color:#B9D5F1;color:var(--cob)}
.chip.a{background:#E4F5FA;border-color:#A8DDEB;color:#126C84}
.chip.g{background:#E6F6EC;border-color:#A9DDBC;color:#1B7A43}
.chip.y{background:#FEF7D7;border-color:#F3DA6B;color:#7A6200}
.chip.r{background:#FBE9E7;border-color:#EBB2AB;color:var(--red)}
.chip.d{background:var(--mid);border-color:var(--mid);color:#fff}
.porte{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--navy);color:#fff;font-family:var(--ft);font-weight:600;font-size:11.5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.farol-g{background:var(--grn)}.farol-y{background:var(--yel)}.farol-r{background:var(--red)}.farol-n{background:var(--border)}
.av{border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px var(--border);vertical-align:middle;background:var(--cream)}
.av.ini{display:inline-grid;place-items:center;background:var(--navy);color:#fff;font-size:11px;font-family:var(--ft)}
.avs{display:inline-flex}.avs .av+.av{margin-left:-8px}
.logo-tile{background:#fff;border:1px solid var(--border);border-radius:var(--r);display:grid;place-items:center;padding:6px}
.logo-tile img{max-width:100%;max-height:100%;object-fit:contain}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--r);background:rgba(255,255,255,.5)}
table.t{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
.t th{text-align:left;font-family:var(--ft);font-weight:600;font-size:12px;color:var(--navy);padding:9px 10px;border-bottom:2px solid var(--mid);background:#fff;white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid #E4E2DC;vertical-align:top}
.t tr:hover td{background:#FBFAF7}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;font-size:14px;color:var(--muted)}
.tabs button.on{border-color:var(--cob);color:var(--mid);font-family:var(--ft);font-weight:600}

/* KPI */
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;border-top:4px solid var(--cob)}
.kpi .v{font-family:var(--ft);font-weight:600;font-size:28px;color:var(--mid);line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi.az{border-top-color:var(--az)}.kpi.mid{border-top-color:var(--mid)}.kpi.red{border-top-color:var(--red)}.kpi.grn{border-top-color:var(--grn)}

/* project cards */
.pcard{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:box-shadow .15s}
.pcard:hover{box-shadow:0 4px 14px rgba(8,25,44,.10);border-color:var(--az)}
.pcard .hd{display:flex;gap:12px;align-items:center}
.pcard .logo-tile{width:96px;height:52px;flex:none}
.pcard .nm{font-family:var(--ft);font-weight:600;font-size:15px}
.pcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid #ECEAE4;padding-top:10px}
.pcard .stats b{font-family:var(--ft);font-size:17px;display:block}
.pcard .stats span{font-size:11.5px;color:var(--muted)}
.alerts{display:flex;gap:6px;flex-wrap:wrap;min-height:22px}

/* planning tree */
.pchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pchip{border:1px solid var(--border);background:#fff;border-radius:var(--r);padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px}
.pchip img{height:20px;max-width:64px;object-fit:contain}
.pchip.on{border-color:var(--cob);box-shadow:0 0 0 2px rgba(6,102,195,.25)}
.ini{background:#fff;border:1px solid var(--border);border-left:5px solid var(--cob);border-radius:var(--r);margin-bottom:16px}
.ini>.hd{padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.ini .obj{background:#F0F6FC;border-radius:6px;padding:8px 10px;margin-top:8px;font-size:13.5px}
.ini .obj b{font-family:var(--ft);font-size:11px;color:var(--cob);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:2px}
.marco{border-top:1px solid #ECEAE4;padding:10px 16px 12px 30px;background:#FCFBF9}
.marco .mh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.marco .mh .tt{font-family:var(--ft);font-weight:600;font-size:14px}
.mes{font-family:var(--ft);font-size:11px;background:var(--navy);color:#fff;border-radius:4px;padding:2px 7px;text-transform:uppercase;letter-spacing:.04em}
.tasks{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:1px solid #E4E2DC;border-radius:6px;padding:8px 10px}
.task .tt{font-size:14px}
.task .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.task .cm{font-size:12.5px;color:var(--muted);margin-top:4px;border-left:3px solid var(--az);padding-left:8px}
.st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff}
.st.planejada{border:2px solid var(--border);background:#fff}
.st.concluida{background:var(--grn)}
.st.nao_concluida{background:var(--red)}
.st.exp{background:var(--gray)}
.load{display:flex;gap:10px;flex-wrap:wrap}
.load .it{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:30px;padding:4px 12px 4px 4px;font-size:13px}
.load .it b{font-family:var(--ft)}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:16px;background:#ECEAE4;border-radius:4px;overflow:hidden;display:flex}
.bar .fl{height:100%}
.bar .vl{font-family:var(--ft);font-weight:600;text-align:right}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cols .c .b{width:100%;max-width:46px;background:var(--cob);border-radius:4px 4px 0 0;min-height:2px}
.cols .c .v{font-family:var(--ft);font-size:12px}
.cols .c .x{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.heat td.h{text-align:center;font-family:var(--ft);font-weight:600}

/* modal */
.ov{position:fixed;inset:0;background:rgba(8,25,44,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:10px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal .mh h2{flex:1;font-size:17px}
.modal .mb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--cream)}
.fld label{display:block;font-size:12.5px;color:var(--navy);font-family:var(--ft);font-weight:600;margin-bottom:4px}
.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld input[type=email],.fld input[type=month],.fld select,.fld textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;background:#fff}
.fld textarea{min-height:76px;resize:vertical}
.fld .help{font-size:12px;color:var(--muted);margin-top:3px}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--red)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:3px 10px 3px 4px;font-family:var(--fb);font-weight:400;font-size:13px;cursor:pointer;color:var(--txt);margin:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:#F0F6FC;border-left:4px solid var(--cob);padding:8px 12px;font-size:13px;border-radius:4px}
.note.warn{background:#FEF7D7;border-color:var(--yel)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--mid);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* one-page */
.op-wrap{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.op-paper{background:#fff;box-shadow:0 6px 24px rgba(8,25,44,.15);width:210mm;min-height:297mm;margin:0 auto;position:relative;overflow:hidden;font-size:10.5pt;color:var(--mid)}
.op-head{background:var(--mid);color:var(--cream);padding:18px 26px;display:flex;align-items:center;gap:18px}
.op-head .hl{height:30px}
.op-head .ttl{flex:1}
.op-head .ttl .k{font-size:8.5pt;letter-spacing:.12em;text-transform:uppercase;color:var(--az)}
.op-head .ttl h1{color:#fff;font-size:17pt;margin-top:2px}
.op-head .cl{background:#fff;border-radius:6px;width:120px;height:56px;display:grid;place-items:center;padding:6px}
.op-head .cl img{max-width:100%;max-height:100%;object-fit:contain}
.op-band{height:4px;background:var(--az)}
.op-meta{display:flex;gap:22px;padding:10px 26px;background:var(--cream);font-size:9pt;color:var(--navy);flex-wrap:wrap}
.op-meta b{font-family:var(--ft)}
.op-body{padding:14px 26px 70px;display:flex;flex-direction:column;gap:12px}
.op-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.op-kpis div{border:1px solid var(--border);border-top:3px solid var(--cob);border-radius:6px;padding:8px 10px}
.op-kpis b{font-family:var(--ft);font-size:17pt;display:block;line-height:1.1}
.op-kpis span{font-size:8.5pt;color:var(--muted)}
.op-sec h3{font-size:10.5pt;color:var(--cob);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:7px}
.op-ini{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dotted #DDD}
.op-ini .n{font-family:var(--ft);font-weight:600;font-size:9.5pt}
.op-ini .o{font-size:8.5pt;color:var(--muted)}
.op-prog{height:8px;background:#ECEAE4;border-radius:4px;overflow:hidden}
.op-prog i{display:block;height:100%;background:var(--cob)}
.op-list{margin:0;padding-left:16px;font-size:9.5pt}
.op-list li{margin-bottom:3px}
.op-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.op-box{background:var(--cream);border-radius:6px;padding:9px 12px;font-size:9.5pt}
.op-box h4{font-size:9pt;margin-bottom:5px}
.op-text{font-size:9.5pt;white-space:pre-wrap}
.op-foot{position:absolute;left:0;right:0;bottom:0;padding:10px 26px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:7.5pt;color:#262626;background:#fff}
.op-wm{position:absolute;top:44%;left:-10%;right:-10%;text-align:center;transform:rotate(-24deg);font-family:var(--ft);font-size:30pt;color:rgba(192,57,43,.13);pointer-events:none;letter-spacing:.06em;white-space:nowrap}
#print-root{display:none}
@media print{
  @page{size:A4;margin:0}
  body.printing{background:#fff}
  body.printing>*:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
  body.printing .op-paper{box-shadow:none;margin:0;width:210mm;height:297mm;min-height:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.op-wrap{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.g2,.g3,.g4,.g5{grid-template-columns:1fr}.content{padding:16px}.top{padding:12px 16px}}

<script>/* ============================================================

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const hoje = () => ymd(new Date());

const semanaDe = s => ymd(mondayOf(parseD(s)));
const fmtDM = s => { if (!s) return '—'; const d = parseD(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const fmtDMY = s => { if (!s) return '—'; const d = parseD(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };

const trimKey = s => { const d = parseD(s); return `${d.getFullYear()}-T${Math.floor(d.getMonth() / 3) + 1}`; };

  const sem0 = semanaAtual(), mes0 = mesKey(sem0), tri = trimKey(sem0);
  const fimTri = (() => { const d = parseD(sem0); const m = Math.floor(d.getMonth() / 3) * 3 + 3; return ymd(new Date(d.getFullYear(), m, 0)); })();

  const MARCOS = [['Diagnóstico concluído e validado com o cliente', -1], ['Modelo proposto e aprovado pela diretoria', 0], ['Implantação iniciada e primeiro ciclo acompanhado', 1]];
  const gestor = db.config.gestorId;

    INI[c.sigla].forEach((titulo, ii) => {
      const dono = p.consultores[ii % p.consultores.length];
      const ini = { id: uuid(), projetoId: p.id, titulo, trimestre: tri, objetivo: `Até ${fmtDMY(fimTri)}: ${titulo.toLowerCase()} desenhado, aprovado e em operação, com indicadores de acompanhamento definidos.`, dataAlvo: fimTri, donoId: dono, status: 'ativa', visivelCliente: true };
      db.iniciativas.push(ini);
      MARCOS.forEach(([mt, off], mi) => {
        const mes = addMes(mes0, off), alvo = ultDia(mes);
        const concl = off < 0 && R() > .25;
        const m = { id: uuid(), iniciativaId: ini.id, titulo: mt, mes, dataAlvo: alvo, dataAlvoOriginal: alvo, status: concl ? 'concluido' : 'aberto', concluidoEm: concl ? addDays(alvo, -Math.floor(R() * 6)) : '', reprogramacoes: 0, historico: [], visivelCliente: true };
        if (off < 0 && !concl && R() > .5) { m.reprogramacoes = 1; m.dataAlvo = addDays(alvo, 14); m.historico.push({ de: alvo, para: m.dataAlvo, motivo: 'Base de dados do cliente entregue com atraso', em: addDays(alvo, -3) }); }
        db.marcos.push(m);
        // tarefas: últimas 4 semanas + semana atual, ligadas ao marco do mês corrente/anterior
        for (let w = -4; w <= 0; w++) {
          const sem = addDays(sem0, 7 * w);
          const mesSem = mesKey(addDays(sem, 2));
          if (mesSem !== mes && !(off === 0 && mesSem > mes)) continue;
          const n = R() < .3 ? 0 : (R() < .8 ? 1 : 2);
          for (let k = 0; k < n; k++) {
            const tipo = pick(db.tipos);
            const resp = pick(p.consultores);
            const parts = [];
            if (p.consultores.length > 1 && R() > .6) parts.push(p.consultores.find(x => x !== resp));
            if (resp !== gestor && MODALIDADES[tipo.modalidade].cliente && R() > .55) parts.push(gestor);
            const t = { id: uuid(), marcoId: m.id, projetoId: p.id, titulo: tipo.nome, tipoId: tipo.id, porte: pick(['P', 'P', 'M', 'M', 'G']), semana: sem, responsavelId: resp, participantes: parts, modalidade: tipo.modalidade, naoPlanejada: false, status: 'planejada', comentario: '', resumoCliente: '', dataRealizada: '', impedimento: null, expurgo: null, reprogramacoes: 0, origemId: null, criadoPor: gestor };
            if (w < 0) {
              const r = R();
              if (r < .72) { t.status = 'concluida'; t.dataRealizada = addDays(sem, Math.floor(R() * 5)); t.comentario = pick(['Realizado conforme planejado; decisões registradas em ata.', 'Concluído; cliente validou a proposta com pequenos ajustes.', 'Entregue. Próximo passo é a validação com a diretoria.', 'Feito; dados consolidados e enviados ao time.']); t.resumoCliente = ''; }
              else {
                t.status = 'nao_concluida';
                const o = pick(['demanda_gestao', 'demanda_cliente', 'dependencia_cliente', 'dependencia_cliente', 'hand_interno']);
                t.impedimento = { origem: o, justificativa: { demanda_gestao: 'Deslocado para apoiar proposta comercial urgente da Hand.', demanda_cliente: 'Cliente solicitou análise emergencial de margem fora do plano.', dependencia_cliente: 'Aguardando extração da base de vendas pelo TI do cliente.', hand_interno: 'Consultor alocado em outra frente na semana.' }[o], textoCliente: { demanda_cliente: 'Priorizada a análise emergencial de margem solicitada pela diretoria.', dependencia_cliente: 'Aguardando envio da base de vendas pelo time de TI.', hand_interno: 'Reprogramado pela equipe Hand para a próxima semana.', demanda_gestao: 'Reprogramado pela equipe Hand para a próxima semana.' }[o] };
                if (ORIGENS[o].expurgavel) t.expurgo = { status: w < -1 ? 'aprovado' : 'pendente', decididoPor: w < -1 ? gestor : '', decididoEm: w < -1 ? addDays(sem, 7) : '', auto: resp === gestor };
              }
            }
            db.tarefas.push(t);
          }
        }
      });
    });
  });
  // reprogramações encadeadas (exemplo)
  db.tarefas.filter(t => t.status === 'nao_concluida' && t.semana === addDays(sem0, -7)).slice(0, 6).forEach((t, i) => {
    db.tarefas.push({ ...t, id: uuid(), semana: sem0, status: 'planejada', comentario: '', impedimento: null, expurgo: null, dataRealizada: '', reprogramacoes: 1 + (i % 3), origemId: t.id });
  });
  // extraprojeto
  const solic = Object.keys(SOLICITANTES);
  for (let w = -4; w <= 0; w++) db.consultores.forEach(c => {
    if (R() > .45) db.extras.push({ id: uuid(), consultorId: c.id, semana: addDays(sem0, 7 * w), data: addDays(sem0, 7 * w + 2), descricao: pick(['Apoio em proposta comercial', 'Reunião interna de pilar', 'Treinamento interno', 'Apoio a projeto especial', 'Revisão de QA']), solicitante: pick(solic), horas: pick([2, 3, 4, 6, 8]), projetoAfetadoId: R() > .5 ? pick(db.projetos).id : '' });
  });
  return db;
}

/* ---------- handlers: (payload, context) -> resultado ---------- */
const COLECOES = ['consultores', 'clientes', 'projetos', 'tipos', 'iniciativas', 'marcos', 'tarefas', 'extras', 'onepages'];

const VALID = {

/* Única porta de entrada das telas para os dados. */
async function invoke(slug, payload = {}) {
  const h = Handlers[slug];
  if (!h) throw new Error('Ação desconhecida: ' + slug);
  const ctx = { db: DB, user: usuarioAtual() };
  const r = h(JSON.parse(JSON.stringify(payload)), ctx);
  if (!slug.endsWith('.carregar')) LocalAdapter.save(DB);

}

   Indicadores — regras de cálculo
   ============================================================ */
const horasPorte = p => (DB.config.porte || {})[p] || 0;
const con = id => DB.consultores.find(c => c.id === id);
const cli = id => DB.clientes.find(c => c.id === id);
const prj = id => DB.projetos.find(p => p.id === id);
const prjCli = p => cli(p.clienteId) || {};
const ini = id => DB.iniciativas.find(i => i.id === id);
const mar = id => DB.marcos.find(m => m.id === id);

const projetosAtivos = () => DB.projetos.filter(p => p.status === 'ativo');
const img = v => !v ? '' : v.startsWith('asset:') ? (ASSETS.logos[v.slice(6)] || ASSETS.fotos[v.slice(6)] || '') : v;
const dataTarefa = t => t.dataRealizada || addDays(t.semana, 2);
const ehInteracao = t => MODALIDADES[t.modalidade]?.cliente;
const ehPresenca = t => t.status === 'concluida' && MODALIDADES[t.modalidade]?.presenca;
const comGestor = t => t.responsavelId === gestorId() || (t.participantes || []).includes(gestorId());
const expurgada = t => t.expurgo?.status === 'aprovado';

/* semanas fechadas = anteriores à semana corrente */
function semanasAte(fim, n) { return Array.from({ length: n }, (_, i) => addDays(fim, -7 * (n - 1 - i))); }

/* Confiabilidade do compromisso: horas-porte concluídas / horas-porte planejadas.
   Fora do cálculo: tarefas não planejadas e expurgos aprovados. */
function confiab(tarefas) {
  let plan = 0, feito = 0, exp = 0, pend = 0;
  tarefas.forEach(t => {
    if (t.naoPlanejada) return;
    const h = horasPorte(t.porte);
    if (expurgada(t)) { exp += h; return; }
    if (t.status === 'planejada') pend += h;
    plan += h; if (t.status === 'concluida') feito += h;
  });
  return { plan, feito, exp, pend, pct: plan ? feito / plan : null };
}

/* Avanço: marcos com data-alvo original dentro do período e já vencidos — concluídos no prazo / total */
function avanco(marcos, ini_, fim_) {
  const lim = hoje() < fim_ ? hoje() : fim_;
  const alvo = marcos.filter(m => { const d = m.dataAlvoOriginal || m.dataAlvo; return d >= ini_ && d <= lim; });
  const noPrazo = alvo.filter(m => m.status === 'concluido' && m.concluidoEm <= (m.dataAlvoOriginal || m.dataAlvo)).length;
  const concl = alvo.filter(m => m.status === 'concluido').length;
  return { total: alvo.length, noPrazo, concl, pct: alvo.length ? noPrazo / alvo.length : null };
}

function presencasMes(projetoId, mes) {
  return DB.tarefas.filter(t => t.projetoId === projetoId && ehPresenca(t) && mesKey(dataTarefa(t)) === mes);
}
function farolPresenca(qtd, mes) {
  const meta = DB.config.metaPresencaMes || 3;
  if (qtd >= meta) return 'g';
  const atual = mesKey(hoje());
  if (mes < atual) return qtd >= meta - 1 ? 'y' : 'r';
  const [y, m] = mes.split('-').map(Number); const dias = new Date(y, m, 0).getDate();
  const esperado = Math.floor(meta * new Date().getDate() / dias);
  return qtd >= esperado ? 'y' : 'r';
}
const marcosDoProjeto = pid => DB.marcos.filter(m => ini(m.iniciativaId)?.projetoId === pid);
const marcoEmRisco = m => m.status !== 'concluido' && (m.dataAlvo < hoje() || (m.reprogramacoes || 0) >= 2);

function ultimaParticipacaoGestor(pid) {
  const ts = DB.tarefas.filter(t => t.projetoId === pid && t.status === 'concluida' && comGestor(t) && ehInteracao(t)).map(dataTarefa).sort();
  return ts.length ? ts[ts.length - 1] : null;
}
function pct(v, d = 0) { return v == null ? '—' : (v * 100).toFixed(d) + '%'; }
function farolPct(v) { return v == null ? 'n' : v >= .85 ? 'g' : v >= .7 ? 'y' : 'r'; }

function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* ---------- modal / formulário genérico ---------- */
function abrirForm({ titulo, campos, valores = {}, botao = 'Salvar', nota = '', onSubmit, extraBotoes = '' }) {
  const ov = document.createElement('div'); ov.className = 'ov';
  const campo = f => {
    const v = valores[f.k] ?? f.def ?? '';
    let inp = '';
    if (f.t === 'textarea') inp = `<textarea name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
    else if (f.t === 'select') inp = `<select name="${f.k}">${f.vazio ? `<option value="">${esc(f.vazio)}</option>` : ''}${f.op.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
    else if (f.t === 'checks') inp = `<div class="checks">${f.op.map(o => `<label><input type="checkbox" name="${f.k}" value="${esc(o.v)}" ${(v || []).includes(o.v) ? 'checked' : ''}> ${o.h || ''}${esc(o.l)}</label>`).join('')}</div>`;
    else if (f.t === 'bool') inp = `<label style="font-family:var(--fb);font-weight:400;display:flex;gap:8px;align-items:center"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}> ${esc(f.txt || '')}</label>`;
    else if (f.t === 'file') inp = `<input type="file" name="${f.k}" accept="image/*">${v ? `<div style="margin-top:6px"><img src="${img(v)}" style="max-height:48px;max-width:160px;object-fit:contain"></div>` : ''}`;
    else inp = `<input type="${f.t || 'text'}" name="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${f.step ? `step="${f.step}"` : ''}>`;
    return `<div class="fld" data-f="${f.k}" style="${f.full ? 'grid-column:1/-1' : ''}"><label>${esc(f.l)}${f.req ? ' *' : ''}</label>${inp}${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}</div>`;
  };
  const meia = campos.filter(f => f.half);
  ov.innerHTML = `<div class="modal" role="dialog"><div class="mh"><h2>${esc(titulo)}</h2><button class="ibtn" data-x>✕</button></div>
  <form class="mb">${nota ? `<div class="note">${nota}</div>` : ''}
  ${(() => { let h = '', buf = []; campos.forEach(f => { if (f.half) buf.push(campo(f)); else { if (buf.length) { h += `<div class="fgrid">${buf.join('')}</div>`; buf = []; } h += campo(f); } }); if (buf.length) h += `<div class="fgrid">${buf.join('')}</div>`; return h; })()}
  </form><div class="mf">${extraBotoes}<button class="btn ghost" data-x>Cancelar</button><button class="btn" data-ok>${esc(botao)}</button></div></div>`;
  document.body.appendChild(ov);
  const fechar = () => ov.remove();
  ov.querySelectorAll('[data-x]').forEach(b => b.onclick = fechar);
  ov.addEventListener('mousedown', e => { if (e.target === ov) fechar(); });
  const form = ov.querySelector('form');
  ov.querySelector('[data-ok]').onclick = async () => {
    const out = {};
    for (const f of campos) {
      if (f.t === 'checks') out[f.k] = [...form.querySelectorAll(`[name="${f.k}"]:checked`)].map(x => x.value);
      else if (f.t === 'bool') out[f.k] = form.querySelector(`[name="${f.k}"]`).checked;
      else if (f.t === 'file') { const fi = form.querySelector(`[name="${f.k}"]`).files[0]; out[f.k] = fi ? await lerImagem(fi, f.max || 360) : (valores[f.k] || ''); }
      else if (f.t === 'number') out[f.k] = Number(form.querySelector(`[name="${f.k}"]`).value);
      else out[f.k] = form.querySelector(`[name="${f.k}"]`).value.trim();
    }
    let erro = false;
    campos.forEach(f => { const el = form.querySelector(`[data-f="${f.k}"]`); const vazio = f.req && (Array.isArray(out[f.k]) ? false : !out[f.k]); el.classList.toggle('err', vazio); if (vazio) erro = true; });
    if (erro) return;
    try { const r = await onSubmit(out); if (r !== false) { fechar(); render(); } } catch (e) { alert(e.message); }
  };
  setTimeout(() => form.querySelector('input,textarea,select')?.focus(), 30);
  return ov;
}
function lerImagem(file, max) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

  const c = prjCli(p);
  // carga da semana

  const carga = {}; tw.forEach(t => { carga[t.responsavelId] = (carga[t.responsavelId] || 0) + horasPorte(t.porte); });
  h += `<div class="card" style="margin-bottom:16px"><div class="row"><div class="small muted">Carga planejada na semana ${semanaLabel(UI.semana)} (todas as frentes, em horas-porte):</div><div class="load">${DB.consultores.filter(x => x.ativo).map(x => `<span class="it">${av(x.id, 26)} ${esc(x.nome)} <b>${carga[x.id] || 0}h</b></span>`).join('')}</div></div></div>`;
  h += `<div class="row" style="margin-bottom:14px">${logoTile(c, 110, 58)}<div><h2>${esc(c.nome)}</h2><div class="small muted">${esc(p.frente)} · ${esc(c.segmento || '')}</div><div class="small">Responsável: ${av(p.responsavelId, 22)} ${esc(con(p.responsavelId)?.nome)} · Equipe: ${avs(p.consultores, 22)}</div></div><div style="flex:1"></div>
    <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-act="todasSem" ${UI.todasSemanas ? 'checked' : ''}> Mostrar tarefas de todas as semanas</label>

function vRegistro() {
  const L = DB.log.slice(0, 300);
  return `<div class="note" style="margin-bottom:12px">Registro de alterações: quem fez o quê e quando. Base para auditoria de expurgos e para a reunião de segunda.</div>` + (L.length ? `<table class="t"><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Item</th><th>Detalhe</th></tr>${L.map(l => { const d = new Date(l.quando); return `<tr><td class="small">${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}</td><td>${av(l.quem, 22)} ${esc(con(l.quem)?.nome || '')}</td><td>${esc(l.acao)}</td><td class="small muted">${esc(l.colecao)}</td><td>${esc(l.resumo)}</td></tr>`; }).join('')}</table>` : '<div class="empty">Nenhuma alteração registrada ainda.</div>');
}

/* ============================================================ shell */
const SEMANAL = ['planejamento', 'fechamento', 'extra', 'onepage'];
function render() {
  const app = document.getElementById('app');
  const pend = DB.tarefas.filter(t => t.expurgo?.status === 'pendente').length;
  const tabInfo = TABS.find(t => t[0] === UI.tab) || TABS[0];
  const views = { painel: vPainel, planejamento: vPlanejamento, fechamento: vFechamento, extra: vExtra, aprovacoes: vAprovacoes, indicadores: vIndicadores, onepage: vOnePage, cadastros: vCadastros, registro: vRegistro };
  const sc = window.scrollY;
  app.innerHTML = `<div class="app"><aside class="side"><div class="brand"><img src="${ASSETS.hand.logoFull}" alt="Hand"><small>Gestão de Projetos</small></div>
    <nav class="nav">${TABS.map(([k, l, ic]) => `<button class="${UI.tab === k ? 'on' : ''}" data-tab="${k}"><span class="ic">${ic}</span>${l}${k === 'aprovacoes' && pend ? `<span class="badge">${pend}</span>` : ''}</button>`).join('')}</nav>
    <div class="foot">©2026 hand/™<br>DOCUMENTO CONFIDENCIAL · v1</div></aside>
    <main class="main">${DB.demo ? `<div class="demo">Dados de demonstração carregados para avaliação. Os cadastros de clientes, projetos e consultores são reais. <button class="btn sm dark" data-act="irDados">Iniciar base real</button></div>` : ''}
    <div class="top"><h1>${tabInfo[1]}</h1><span class="sp"></span>
      ${SEMANAL.includes(UI.tab) ? `<div class="weeknav"><button data-act="semPrev" title="Semana anterior">◀</button><div class="lbl">Semana ${semanaLabel(UI.semana)}${UI.semana === semanaAtual() ? '<div class="now">semana atual</div>' : ''}</div><button data-act="semNext" title="Próxima semana">▶</button>${UI.semana !== semanaAtual() ? '<button data-act="semHoje">Hoje</button>' : ''}</div>` : ''}
      <div class="userbox">${av(usuarioAtual()?.id, 30)}<span>Usuário</span><select data-act="user" title="Na versão publicada, o usuário vem do login">${optList(DB.consultores.filter(c => c.ativo), usuarioAtual()?.id)}</select></div></div>
    <div class="content">${views[UI.tab]()}</div></main></div>`;
  window.scrollTo(0, sc);
}

/* ---------- eventos ---------- */
document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { UI.tab = tb.dataset.tab; salvarUI(); window.scrollTo(0, 0); return render(); }
  const gp = e.target.closest('[data-go-proj]'); if (gp) { UI.projetoId = gp.dataset.goProj; UI.tab = 'planejamento'; salvarUI(); window.scrollTo(0, 0); return render(); }
  const pc = e.target.closest('[data-proj]'); if (pc) { UI.projetoId = pc.dataset.proj; return render(); }
  const oc = e.target.closest('[data-op]'); if (oc) { UI.opProjetoId = oc.dataset.op; return render(); }
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || b.type === 'file' || b.type === 'checkbox') return;
  const id = b.dataset.id, A = b.dataset.act;
  const T = () => DB.tarefas.find(t => t.id === id);
  switch (A) {
    case 'semPrev': UI.semana = addDays(UI.semana, -7); return render();
    case 'semNext': UI.semana = addDays(UI.semana, 7); return render();
    case 'semHoje': UI.semana = semanaAtual(); return render();
    case 'novaIni': return formIniciativa(UI.projetoId);
    case 'editIni': return formIniciativa(ini(id).projetoId, ini(id));
    case 'novoMarco': return formMarco(id);
    case 'editMarco': return formMarco(mar(id).iniciativaId, mar(id));
    case 'reprogMarco': return formReprogMarco(mar(id));
    case 'concluirMarco': return acao('gp.marco.concluir', { id }, 'Marco concluído');
    case 'reabrirMarco': return acao('gp.marco.reabrir', { id });
    case 'novaTarefa': return formTarefa(id);
    case 'editTarefa': return formTarefa(T().marcoId, T());
    case 'concluir': return formConcluir(T());
    case 'naoConcluir': return formNaoConcluir(T());
    case 'reabrir': return acao('gp.tarefa.reabrir', { id }, 'Tarefa reaberta');
    case 'naoPlan': { const ms = DB.marcos.filter(m => ini(m.iniciativaId)?.projetoId === id && m.status !== 'concluido'); if (!ms.length) return alert('O projeto não tem marcos em aberto. Crie um marco no Planejamento.'); return abrirForm({ titulo: 'Tarefa não planejada — escolha o marco', campos: [{ k: 'm', l: 'Marco mensal ao qual a tarefa se vincula', t: 'select', op: ms.map(m => ({ v: m.id, l: `${mesLabel(m.mes)} · ${m.titulo} (${ini(m.iniciativaId).titulo})` })) }], botao: 'Continuar', onSubmit: v => { setTimeout(() => formTarefa(v.m, {}, true), 10); } }); }
    case 'novoExtra': return formExtra();
    case 'editExtra': return formExtra(DB.extras.find(x => x.id === id));
    case 'aprovar': return acao('gp.expurgo.decidir', { id, decisao: 'aprovado' }, 'Expurgo aprovado');
    case 'recusar': return acao('gp.expurgo.decidir', { id, decisao: 'recusado' }, 'Expurgo recusado');
    case 'indN': UI.indN = +b.dataset.n; return render();
    case 'cadTab': UI.cadTab = b.dataset.k; return render();
    case 'irDados': UI.tab = 'cadastros'; UI.cadTab = 'dados'; return render();
    case 'novoCli': return formCliente(); case 'editCli': return formCliente(cli(id));
    case 'novoProj': return formProjeto(); case 'editProj': return formProjeto(prj(id));
    case 'novoCon': return formConsultor(); case 'editCon': return formConsultor(con(id));
    case 'novoTipo': return formTipo(); case 'editTipo': return formTipo(tipo(id));
    case 'salvarCfg': return acao('gp.config.salvar', { porte: { P: +document.getElementById('cfg-P').value, M: +document.getElementById('cfg-M').value, G: +document.getElementById('cfg-G').value }, metaPresencaMes: +document.getElementById('cfg-meta').value, exigirAprovacaoOnePage: document.getElementById('cfg-apr').checked, gestorId: document.getElementById('cfg-gestor').value }, 'Parâmetros salvos');
    case 'exportar': { const bl = new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = `hand-gestao-projetos-${hoje()}.json`; a.click(); return; }
    case 'limparBase': { if (!confirm('Apagar todas as iniciativas, marcos, tarefas, extraprojetos e one-pages de demonstração? Os cadastros são mantidos.')) return; const keep = { consultores: DB.consultores, clientes: DB.clientes, projetos: DB.projetos, tipos: DB.tipos, config: DB.config }; await invoke('gp.dados.base'); Object.assign(DB, keep); LocalAdapter.save(DB); toast('Base real iniciada'); return render(); }
    case 'carregarDemo': if (!confirm('Substituir a base atual pela demonstração?')) return; await invoke('gp.dados.demo'); return render();
    case 'opSalvar': case 'opAprovar': case 'opEnviado': {
      const pl = { projetoId: UI.opProjetoId, semana: UI.semana, destaque: document.getElementById('op-destaque').value, pedidoCliente: document.getElementById('op-pedido').value, proximosPassos: document.getElementById('op-prox').value };
      if (A === 'opAprovar') pl.aprovar = true; if (A === 'opEnviado') pl.enviado = true;
      return acao('gp.onepage.salvar', pl, A === 'opAprovar' ? 'One-page aprovado' : A === 'opEnviado' ? 'Marcado como enviado' : 'Textos salvos');
    }
    case 'opPdf': {
      const pl = { projetoId: UI.opProjetoId, semana: UI.semana, destaque: document.getElementById('op-destaque').value, pedidoCliente: document.getElementById('op-pedido').value, proximosPassos: document.getElementById('op-prox').value };
      await invoke('gp.onepage.salvar', pl);
      const op = DB.onepages.find(o => o.projetoId === pl.projetoId && o.semana === pl.semana);
      if (DB.config.exigirAprovacaoOnePage && !op.aprovadoPor && !confirm('Este one-page ainda não foi aprovado pelo gestor e sairá com a marca "RASCUNHO". Gerar mesmo assim?')) return render();
      const pr = document.getElementById('print-root'); pr.innerHTML = htmlOnePage(pl.projetoId, pl.semana);
      const t0 = document.title; document.title = `StatusReport_${prjCli(prj(pl.projetoId)).sigla}_${pl.semana}`;
      document.body.classList.add('printing'); setTimeout(() => { window.print(); document.body.classList.remove('printing'); document.title = t0; render(); }, 60); return;
    }
  }
});
document.addEventListener('change', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'user') { UI.userId = b.value; UI.fechConsultor = null; salvarUI(); return render(); }
  if (b.dataset.act === 'fechCons') { UI.fechConsultor = b.value; return render(); }
  if (b.dataset.act === 'todasSem') { UI.todasSemanas = b.checked; return render(); }
  if (b.dataset.act === 'importar') { const f = b.files[0]; if (!f) return; try { const db = JSON.parse(await f.text()); if (!confirm('Substituir a base atual pelo arquivo importado?')) return; await invoke('gp.dados.substituir', { db }); LocalAdapter.save(DB); toast('Base importada'); render(); } catch (err) { alert('Arquivo inválido: ' + err.message); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelector('.ov')?.remove(); });

/* ---------- início ---------- */
(async function iniciar() {
  DB = LocalAdapter.load();
  if (!DB) { DB = seedDemo(); LocalAdapter.save(DB); }
  await invoke('gp.estado.carregar');
  if (!UI.userId || !con(UI.userId)) UI.userId = DB.config.gestorId;
  render();
})();
</script>
</body></html>
